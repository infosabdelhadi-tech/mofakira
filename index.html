<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./mofakkira-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="description" content="مفكرة الإدارة التربوية (MOFAKIRA) - التطبيق الرقمي المتكامل لمديرات ومديري التعليم الابتدائي بالمملكة المغربية. تدبير العمليات، المهام، جداول الاجتماعات، والمفكرة اليومية." />
    <meta name="keywords" content="مفكرة الإدارة التربوية, التدبير التربوي, التعليم الابتدائي المغرب, مدير المدرسة, برنامج العمل السنوي, مجالس المؤسسة, رقمنة الإدارة المدرسية" />
    <meta name="author" content="MOFAKIRA" />

    <!-- Open Graph / Meta Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="مفكرة الإدارة التربوية | تدبير العمليات والمهام المدرسية" />
    <meta property="og:description" content="تطبيق رقمي حديث للإدارة التربوية الابتدائية بالمغرب - تنظيم المهام، برمجة العمليات، محاضر المجالس والتقارير الرسمية." />
    <meta property="og:image" content="./mofakkira-icon.svg" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="المفكرة التربوية" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />

    <title>مفكرة الإدارة التربوية | منظومة تدبير العمليات والمهام المدرسية</title>

    <!-- Google Fonts: Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <style>
      /* Fallback style for inline splash loader before React hydration */
      #mofakira-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        color: #1e293b;
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      @media (prefers-color-scheme: dark) {
        #mofakira-splash {
          background-color: #0f172a;
          color: #f1f5f9;
        }
      }
      .mofakira-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #cbd5e1;
        border-top-color: #0d9488;
        border-radius: 50%;
        animation: mofakira-spin 0.9s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes mofakira-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 antialiased font-cairo selection:bg-teal-500 selection:text-white">
    <div id="root">
      <!-- Native Splash Screen ensuring no blank white screen while assets initialize -->
      <div id="mofakira-splash">
        <div class="mofakira-spinner"></div>
        <div style="font-weight: 700; font-size: 1.25rem; margin-bottom: 6px;">مفكرة الإدارة التربوية</div>
        <div style="font-size: 0.875rem; color: #64748b; margin-bottom: 16px;">جاري تشغيل المنظومة واسترجاع البيانات...</div>
        <noscript>
          <div style="background-color: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; font-size: 0.875rem; max-width: 400px;">
            يتطلب التطبيق تفعيل لغة JavaScript في المتصفح للعمل.
          </div>
        </noscript>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
